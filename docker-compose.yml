services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qrorder
      POSTGRES_USER: qrorder
      POSTGRES_PASSWORD: qrorder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrorder -d qrorder"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: qrorder
      DB_USER: qrorder
      DB_PASSWORD: qrorder
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: