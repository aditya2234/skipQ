server:
  port: 8080
spring:
  application:
    name: qrorder
  profiles:
    default: dev
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://`$`{DB_HOST:localhost}:`$`{DB_PORT:5432}/`$`{DB_NAME:qrorder}
    username: `$`{DB_USER:qrorder}
    password: `$`{DB_PASSWORD:qrorder}
  flyway:
    enabled: true